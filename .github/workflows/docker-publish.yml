name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      multiarch:
        description: 'Also build linux/arm64 (slow QEMU emulation)'
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/flui-cloud/core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 (QEMU-emulated) is slow, so build it only for releases (v* tags)
      # or on-demand via workflow_dispatch. Branch pushes stay amd64-only for a
      # fast dev/test loop.
      - name: Decide target platforms
        id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.multiarch }}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "arm=false" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is only needed to emulate arm64 on the amd64 runner.
      - name: Set up QEMU
        if: steps.platforms.outputs.arm == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
