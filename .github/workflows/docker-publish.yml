name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      multiarch:
        description: 'Also build linux/arm64 (slow QEMU emulation)'
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/flui-cloud/core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 (QEMU-emulated) is slow, so build it only for releases (v* tags)
      # or on-demand via workflow_dispatch. Branch pushes stay amd64-only for a
      # fast dev/test loop.
      - name: Decide target platforms
        id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.multiarch }}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "arm=false" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is only needed to emulate arm64 on the amd64 runner.
      - name: Set up QEMU
        if: steps.platforms.outputs.arm == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release-index:
    name: Publish release index
    needs: build-and-push
    # Only a real release: `main` pushes and workflow_dispatch build images
    # without cutting a release, and get nothing added to releases.json.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # release-index.ts diffs migrations against the previous release's
          # tag and reads that tag's commit date — needs the full history and
          # every tag, not the shallow single-branch clone checkout defaults to.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate the entry for this release
        run: pnpm release:index --verify-tag "${{ github.ref_name }}"

      - name: Commit and push, if the index actually changed
        run: |
          if git diff --quiet -- releases.json; then
            echo "releases.json already describes ${{ github.ref_name }} — nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases.json
          git commit -m "chore(release): publish ${{ github.ref_name }} to releases.json"
          # main may have moved since checkout; a release tag is a rare,
          # single-writer event, so one rebase-and-retry covers the race
          # without a full lock.
          git pull --rebase origin main
          git push origin HEAD:main
