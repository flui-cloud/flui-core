name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/flui-cloud/core

jobs:
  # One runner per architecture, each building natively.
  #
  # arm64 used to be emulated with QEMU on an amd64 runner, which is both slow
  # and unsound: a release build was seen dying with `qemu: uncaught target
  # signal 4 (Illegal instruction)` inside `pnpm install`, after which the step
  # retried forever and the job sat there until somebody noticed. Building each
  # architecture on its own machine removes the emulator from the picture, and
  # costs nothing here because arm64 runners are free for public repositories.
  #
  # Each job pushes an untagged image by digest; `merge` is what gives the
  # release its name, once both architectures exist.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A build that has stopped making progress should say so, not occupy a
    # runner for the six hours GitHub allows by default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the architecture for the cache scope
        id: arch
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Nothing was cached between releases before, so every build repeated
          # the whole install and compile. The scope is per-architecture: one
          # shared scope would have the two jobs overwrite each other's layers.
          cache-from: type=gha,scope=${{ steps.arch.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.slug }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.arch.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags live here, and only here: an image named before both architectures
  # exist is a tag that resolves for half the fleet.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Check what was published
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  publish-release-index:
    name: Publish release index
    needs: merge
    # Only a real release: `main` pushes and workflow_dispatch build images
    # without cutting a release, and get nothing added to releases.json.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # release-index.ts diffs migrations against the previous release's
          # tag and reads that tag's commit date — needs the full history and
          # every tag, not the shallow single-branch clone checkout defaults to.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate the entry for this release
        run: pnpm release:index --verify-tag "${{ github.ref_name }}"

      - name: Commit and push, if the index actually changed
        run: |
          if git diff --quiet -- releases.json; then
            echo "releases.json already describes ${{ github.ref_name }} — nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases.json
          git commit -m "chore(release): publish ${{ github.ref_name }} to releases.json"
          # main may have moved since checkout; a release tag is a rare,
          # single-writer event, so one rebase-and-retry covers the race
          # without a full lock.
          git pull --rebase origin main
          git push origin HEAD:main
