name: Build and Push flui-postgres Image

# Runs ONLY when the postgres image build context (or this workflow) changes,
# not on every push — the image is a stable building block. Use the manual
# trigger to force a rebuild without touching the files.
on:
  push:
    branches:
      - main
    paths:
      - 'images/postgres/**'
      - '.github/workflows/docker-publish-postgres.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/flui-cloud/flui-postgres

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 15 and 16 exist so a catalog bundle pinned to them can move onto this
    # image without a major upgrade; 17 keeps its historical tags.
    strategy:
      matrix:
        pg_major: ['15', '16', '17']
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Multi-arch (amd64 + arm64); QEMU emulates arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.pg_major }}-dev
            type=sha,prefix=${{ matrix.pg_major }}-,format=short
            type=sha,prefix=,format=short,enable=${{ matrix.pg_major == '17' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/postgres
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
