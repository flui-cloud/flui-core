name: Publish MariaDB shipper image

# Rebuilt per MariaDB major, because `mariadb-backup` has to match the server
# it reads: a base backup taken with one major does not open under another.
# The matrix is the list of majors the catalog offers, and adding one here is
# the same edit as adding one to the catalog.
on:
  push:
    branches: [main]
    paths:
      - 'images/mariadb-shipper/**'
      - '.github/workflows/docker-publish-mariadb-shipper.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/mariadb-shipper

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        major: ['11']
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/mariadb-shipper
          # arm64 as well as amd64: Flui runs on both, and a shipper missing on
          # one of them is a database silently without continuous backup there.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MARIADB_MAJOR=${{ matrix.major }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.major }}-${{ github.sha }}
