apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ISSUER_NAME}}
  labels:
    managed-by: flui-cloud
spec:
  acme:
    server: {{ACME_SERVER}}
    email: {{ACME_EMAIL}}
    privateKeySecretRef:
      name: {{PRIVATE_KEY_SECRET_REF}}
    solvers:
      - http01:
          ingress:
            class: traefik
            # cert-manager defaults the solver Service to NodePort, which opens a
            # port on every node for the length of a challenge and is refused
            # outright by a namespace whose quota forbids NodePorts. Traefik
            # reaches the solver through the Ingress below, so ClusterIP is enough.
            serviceType: ClusterIP
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                  traefik.ingress.kubernetes.io/router.priority: "20000000"
