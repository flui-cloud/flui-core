apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
  labels:
{{LABELS_BLOCK}}
  annotations:
{{ANNOTATIONS_BLOCK}}
spec:
  serviceName: {{SLUG}}-headless
  replicas: {{REPLICAS}}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Uninstalling an application takes its data with it; scaling in
  # is reversible, so a claim outlives the replica that used it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: {{SLUG}}
  template:
    metadata:
      labels:
{{POD_LABELS_BLOCK}}
      annotations:
{{POD_ANNOTATIONS_BLOCK}}
    spec:
{{POD_SECURITY_CONTEXT_BLOCK}}
{{NODE_PLACEMENT_BLOCK}}
{{IMAGE_PULL_SECRETS_BLOCK}}
{{INIT_CONTAINERS_BLOCK}}
      containers:
        - name: {{SLUG}}
          image: "{{IMAGE}}"
          imagePullPolicy: {{PULL_POLICY}}
{{CONTAINER_SECURITY_CONTEXT_BLOCK}}
{{COMMAND_OVERRIDE_BLOCK}}
{{PORTS_BLOCK}}
{{ENV_BLOCK}}
          resources:
            requests:
              cpu: "{{CPU_REQUEST}}"
              memory: "{{MEMORY_REQUEST}}"
            limits:
              cpu: "{{CPU_LIMIT}}"
              memory: "{{MEMORY_LIMIT}}"
{{READINESS_PROBE_BLOCK}}
{{VOLUME_MOUNTS_BLOCK}}
{{SIDECARS_BLOCK}}
{{CONFIG_VOLUMES_BLOCK}}
{{VOLUME_CLAIM_TEMPLATES_BLOCK}}
