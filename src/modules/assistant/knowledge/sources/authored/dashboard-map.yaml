generatedFrom:
  dashboardCommit: fab5caf
  coreCommit: 0dc5c07
  verifiedOn: 2026-10-19
visibility_notes:
  - text: "Each sidebar section is shown only when the user's permissions include its section key: Cluster needs 'clusters', Workloads needs 'workloads', Deploy needs 'deploy', and the Firewall group needs 'firewall'."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.html:67'
  - text: 'Section checks use canSee(section), which asks the permission service whether the section is in the list returned by /me/permissions.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:223'
  - text: "Infrastructure entries (Compute, Costs, Virtual Networks, SSH Keys, Domains, Platform) each require the 'infrastructure' section; the Infrastructure section disappears when none is visible and the Firewall group is hidden too."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar-nav.config.ts:40'
  - text: "Management entries map to sections: Now to 'clusters', Providers, Image registry and GitHub Setup to 'providers', Backup and Migrations to 'backup', Mail to 'mail', Access to 'access', Projects to 'projects', Updates to 'infrastructure', Settings to 'settings'. 'How it is run' and 'Agents' have no section mapping, so they are shown whenever the demo fence admits them."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar-nav.config.ts:5'
  - text: 'SSH Keys, Platform, GitHub Setup and Image registry (FULL_ACCESS_ONLY_LABELS) are hidden when the user has their section in read-only mode.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar-nav.config.ts:19'
  - text: 'The full-access-only rule is applied in shows(): an entry in FULL_ACCESS_ONLY_LABELS is kept only if the section is not read-only.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:232'
  - text: 'On a demo instance, Topology, Scaling, SSH Keys, Platform, Image registry, GitHub Setup and Updates (READS_BY_LABEL) appear only if the demo fence lets the guest make the first read that page needs, so the menu never leads into a refusal. Outside a demo every read is allowed.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar-nav.config.ts:30'
  - text: 'The demo-fence check (admitted) is applied to Topology, the Cluster entries and to Infrastructure and Management entries; sandbox.allows() returns true when not in a sandbox.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:227'
  - text: "The Workloads System entry is added only after the user clicks 'Show system' under the Workloads group; the choice is remembered in the browser."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:348'
  - text: "The 'Show system' / 'Hide system' button is rendered only while the sidebar and the Workloads group are expanded."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.html:103'
  - text: "Workloads labels carry a count when non-zero, for example 'Applications (4)'; Projects shows the number of projects."
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:323'
  - text: 'When an application is opened, the sidebar highlights the list it belongs to (Applications, Data or System) rather than always Applications.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.ts:307'
  - text: 'The user menu (sidebar footer) has Account, Settings and Log out; Account is hidden for anonymous demo visitors.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.html:225'
  - text: 'The sidebar has a search box; a search hides whole sections with no matching entry. Entries can be pinned.'
    source: 'flui-dashboard/src/app/layout/components/sidebar/sidebar.component.html:33'
