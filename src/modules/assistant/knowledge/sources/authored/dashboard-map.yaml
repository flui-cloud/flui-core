visibility_notes:
  - text: 'The console menu has six groups: an unnamed first group (Overview, Topology), Workloads, Delivery, Infrastructure, Operations and Administration. A group disappears when none of its entries is visible.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.config.ts:22'
  - text: "An entry with a section key is shown only when /me/permissions includes that section: Image registry and Providers and GitHub app need 'providers'; Compute, Networks, Domains and DNS, SSH keys, Platform, Costs and Updates need 'infrastructure'; Live needs 'clusters'; Backups and Migrations need 'backup'; Mail needs 'mail'; Access needs 'access'; Settings needs 'settings'. Overview, Topology, the Workloads entries, Deploy, App catalog, Repositories, Templates, Clusters, Scaling, Firewall and Agents have no section key."
    source: 'flui-dashboard/src/app/layout/console/console-nav.ts:92'
  - text: 'Image registry, SSH keys, Platform and GitHub app (fullAccessOnly) are hidden when the user has their section in read-only mode.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.config.ts:112'
  - text: 'On a demo instance, Topology, Image registry, Scaling, SSH keys, Platform, GitHub app and Updates appear only if the demo fence lets the guest make the first read that page needs, so the menu never leads into a refusal. Outside a demo every read is allowed.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.ts:94'
  - text: "Workloads > System apps is shown only after the user ticks 'Show system apps' in the user menu; the choice is remembered in the browser."
    source: 'flui-dashboard/src/app/layout/console/console-nav.config.ts:71'
  - text: 'Applications, Data stores, System apps and Projects show a count next to the label when it is not zero.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.ts:36'
  - text: 'When an application is opened, the menu highlights the list it belongs to (Applications, Data stores or System apps) rather than always Applications.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.ts:46'
  - text: 'Updates shows the available version next to its label when a platform update is available.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.config.ts:276'
  - text: 'The top bar has a search field that opens a command palette listing every visible menu entry by name and keywords.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.ts:74'
  - text: 'The help menu (question mark in the top bar) has How Flui is run, a link to the source code and the running Flui version.'
    source: 'flui-dashboard/src/app/layout/console/console-topbar.ts:74'
  - text: 'The user menu (name in the top bar) has Account, Settings, Show system apps, Mask sensitive values and Log out; Account is hidden for anonymous demo visitors.'
    source: 'flui-dashboard/src/app/layout/console/console-topbar.ts:99'
  - text: 'Projects is managed from Workloads > Projects; the full project management page (/management/projects) is not in the menu and is reached from the Manage projects button there.'
    source: 'flui-dashboard/src/app/layout/console/console-nav.config.ts:64'
