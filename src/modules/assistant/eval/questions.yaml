      - 2 gb|2gb
      - arm|aarch64
    must_not_include:
      - windows server
      - centos|debian 12|rocky
    expected_sections: [concepts/02-why-k3s, cli/environments]
    source: 'get-flui-running.mdx:71,241,246-248; concepts/02-why-k3s.md:69-92; cli/src/commands/env/create.ts:262-263 (memMb < 1800, recommend >=2GB)'

  - id: g05
