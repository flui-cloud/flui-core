  # ---------------------------------------------------------------- tools
  # Tool questions are graded against a state snapshot taken around each run;
  # reporting the stored status is right, inventing a cause is not. Metric
  # values are compared with the run's snapshot; mechanical checks use stable
  # facts only.
  - id: s01
    group: strumenti
    question: 'Which of my apps are failing right now, and why?'
    expect_tools: [app_list]
    must_not_include:
      - out of memory|oomkilled|crashloop|imagepullbackoff|image pull
    source: 'state flips (see header). 04:20: GET /clusters/48606938…/applications: the four flui-demo-activity-313e8a-* apps (app, nats, redis, postgres) status failed, reconciliationError "Failed to fetch resource metadata … The user aborted a request"; control-cluster user apps all running; metrics show the demo pods Running 1/1, restarts 0; 04:35 all running. Right: the apps stored as failed at that moment (or none), no invented cause'

