# Flui Assistant eval battery.
#
# Every expected fact is verified in source, CLI help or flui-docs; `source`
# names where. Questions are never softened to fit a result: add new ones, fix
# one only when its expectation was wrong.
#
# Fields:
#   id, group, question            required
#   as                             operator (default) | guest
#   page                           dashboard route the question is asked on (UI path)
#   must_include                   facts; each item is a list of alternatives split by '|'
#   must_not_include               claims that make the answer wrong
#   expected_sections              KB section ids the router should pick
#   expect_refusal                 true for off-topic questions
#   source                         where the expected facts were verified
#
# Groups: ospite, operatore, dopo-l-installazione, trappole, fuori-tema, pagina-corrente.

questions:
  # ---------------------------------------------------------------- ospite
  - id: g01
    group: ospite
    as: guest
    question: "Cos'è Flui, in due frasi?"
    must_include:
      - open source|open-source
      - provider|server|cloud
      - applicazion|app
    must_not_include:
      - managed kubernetes service|servizio kubernetes gestito
    expected_sections: [concepts/00-what-is-flui]
    source: 'flui-docs concepts/00-what-is-flui.mdx:1-10 ("Flui is an open source platform for running applications. It sits on top of your cloud provider")'

  - id: g02
    group: ospite
    as: guest
    question: 'Which cloud providers does Flui support?'
    must_include:
      - hetzner
      - scaleway
      - ovh
      - own server|your own|byos|--host
    must_not_include:
      - aws|amazon web services
      - azure
      - google cloud|gcp
      - contabo
    expected_sections: [concepts/01-flui-vs-provider-layer]
    source: 'flui-docs concepts/01-flui-vs-provider-layer.md:184-194 (Hetzner, Scaleway, OVHcloud, Your own servers)'

  - id: g03
    group: ospite
    as: guest
    question: 'Posso installare Flui su un mio server invece che su un provider? Come?'
    must_include:
      - flui env create
      - --host
      - ubuntu
    must_not_include:
      - docker compose up
      - helm install
    expected_sections: [cli/environments, concepts/04-creating-a-cluster]
    source: 'flui-docs tasks/get-flui-running.mdx:71,211-234 (flui env create --host, Ubuntu 22.04/24.04); cli env create --help'

  - id: g04
    group: ospite
    as: guest
    question: 'What does my own server need to run Flui? OS, memory, CPU architecture.'
    must_include:
