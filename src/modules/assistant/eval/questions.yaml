        concepts/05-multi-cluster-topology,
        concepts/09-anatomy-of-the-observability-cluster,
      ]
    source: 'flui-docs tasks/add-a-cluster.mdx:40-43 ("The first cluster ... is the control cluster. It runs the dashboard, the API, the login and the database. A workload cluster ... runs only applications.")'

  - id: g06
    group: ospite
    as: guest
