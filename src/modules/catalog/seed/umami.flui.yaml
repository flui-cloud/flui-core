kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: umami
  name: Umami
  description: >
    Privacy-first, cookieless web analytics — a lightweight, GDPR-compliant
    alternative to Google Analytics. Track page views and visitors with a
    sub-2KB script and a clean dashboard, with full ownership of your data.
    Ships as the app plus its own PostgreSQL, installed and torn down together.
    Sign in as admin with the password chosen in the install form: it replaces
    Umami's built-in default at install.
  appKind: APPLICATION
  category: analytics
  tags:
    - analytics
    - web-analytics
    - privacy
    - gdpr
    - cookieless
    - composed
  license: MIT
  version: '3.5'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/umami.svg
  links:
    website: https://umami.is
    docs: https://umami.is/docs
    source: https://github.com/umami-software/umami
  ratings:
    wow: 4
    utility: 4
    euFit: 5
    community: 4
  alternativeTo:
    - Google Analytics
    - Plausible
    - Matomo

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: umami.internal

  components:
    - name: db
      engine: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '15-alpine'
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 5Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: umami
        - name: POSTGRES_USER
          value: umami
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 5432
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: umami
      dependsOn:
        - db
      image:
        registry: ghcr.io
        repository: umami-software/umami
        tag: 3.5.0
      ports:
        - name: http
          internal: 3000
          expose: true
          protocol: http
      env:
        - name: DATABASE_URL
          value: 'postgresql://{{components.db.env.POSTGRES_USER}}:{{components.db.env.POSTGRES_PASSWORD}}@{{components.db.host}}:5432/{{components.db.env.POSTGRES_DB}}'
          secret: true
        - name: APP_SECRET
          valueFrom:
            generate: secret
            length: 32
            format: hex
          description: Salt used to hash session/visitor identifiers. Generated once at install.
        - name: TWO_FACTOR_ENCRYPTION_KEY
          valueFrom:
            generate: secret
            length: 64
            format: hex
          description: Encrypts the two-factor authentication secrets of users. Generated once at install; changing it disables everyone's two-factor sign-in.
        - name: UMAMI_ADMIN_PASSWORD
          valueFrom:
            userInput:
              label: Admin password
              sensitive: true
              format: password
              confirm: true
              minLength: 10
              maxLength: 128
              pattern: '^.{10,128}$'
              patternDescription: At least 10 characters
          description: Password of the admin account, which replaces Umami's default one at install. Flui does not store or log it outside this install.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /api/heartbeat
        port: 3000
        initialDelay: 20s
        interval: 15s
        timeout: 5s
        retries: 6

  auth:
    mode: native

  # Umami always creates admin/umami and has no setting for it, so the password
  # is replaced through its own API once it runs.
  postInstall:
    - name: replace-default-password
      exec:
        component: umami
        command:
          - node
          - -e
          - |
            const api = 'http://127.0.0.1:3000/api';
            const json = { 'Content-Type': 'application/json' };
            (async () => {
              const login = await fetch(api + '/auth/login', {
                method: 'POST',
                headers: json,
                body: JSON.stringify({ username: 'admin', password: 'umami' }),
              });
              if (!login.ok) return console.log('default password already gone');
              const { token } = await login.json();
              const change = await fetch(api + '/me/password', {
                method: 'POST',
                headers: { ...json, Authorization: 'Bearer ' + token },
                body: JSON.stringify({
                  currentPassword: 'umami',
                  newPassword: process.env.UMAMI_ADMIN_PASSWORD,
                }),
              });
              console.log('password changed', change.status);
            })().catch((e) => console.log(e.message));

  smokeTest:
    type: http
    path: /api/heartbeat
    expectedStatus: 200
    timeoutSeconds: 60
