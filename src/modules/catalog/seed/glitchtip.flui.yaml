kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: glitchtip
  name: GlitchTip
  description: >
    Error tracking for your applications, compatible with the Sentry SDKs:
    point an existing Sentry client at its DSN and exceptions, stack traces,
    releases and uptime checks arrive in one place. Ships as GlitchTip, its own
    PostgreSQL and Valkey, installed and torn down together. The administrator
    is created at install and sign-up is closed: the admin invites everyone
    else. Invitations and alerts are sent by email once an SMTP server is set
    in EMAIL_URL.
  appKind: TOOL
  category: monitoring
  tags:
    - error-tracking
    - monitoring
    - sentry-compatible
    - uptime
    - observability
    - composed
  license: MIT
  version: '7.0'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/glitchtip.svg
  links:
    website: https://glitchtip.com
    docs: https://glitchtip.com/documentation
    source: https://gitlab.com/glitchtip/glitchtip-backend
  ratings:
    wow: 3
    utility: 5
    euFit: 5
    community: 3
  alternativeTo:
    - Sentry
    - Azure Application Insights
    - Bugsnag

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: glitchtip.internal

  components:
    - name: db
      engine: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '17-alpine'
      # Events are stored in partitioned tables; a query that cannot narrow to
      # one partition locks every partition, which outgrows the default of 64.
      command:
        - docker-entrypoint.sh
        - postgres
        - -c
        - max_locks_per_transaction=512
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 10Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: glitchtip
        - name: POSTGRES_USER
          value: glitchtip
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - pg_isready
          - -U
          - glitchtip
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: valkey
      engine: valkey
      image:
        registry: docker.io
        repository: valkey/valkey
        tag: '9-alpine'
      ports:
        - name: valkey
          internal: 6379
          expose: false
          protocol: tcp
      env: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '1'
            memory:
              min: 64Mi
              max: 512Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 6379
        initialDelay: 10s
        interval: 10s
        timeout: 5s
        retries: 6

    - name: glitchtip
      dependsOn:
        - db
        - valkey
      image:
        registry: docker.io
        repository: glitchtip/glitchtip
        tag: 7.0.0
      ports:
        - name: http
          internal: 8000
          expose: true
          protocol: http
      volumes:
        - name: uploads
          mountPath: /code/uploads
          required: true
          size: 5Gi
      # The image runs as the numeric user 5000; fsGroup lets it own the volume.
      securityContext:
        fsGroup: 5000
        runAsUser: 5000
        runAsGroup: 5000
      env:
        - name: DATABASE_URL
          value: 'postgres://{{components.db.env.POSTGRES_USER}}:{{components.db.env.POSTGRES_PASSWORD}}@{{components.db.host}}:5432/{{components.db.env.POSTGRES_DB}}'
          secret: true
        - name: VALKEY_URL
          value: 'redis://{{components.valkey.host}}:6379/0'
        - name: SECRET_KEY
          valueFrom:
            generate: secret
            length: 50
          description: Signs sessions and tokens. Generated once at install; changing it signs everyone out.
        - name: GLITCHTIP_URL
          value: 'https://{{self.fqdn}}'
        - name: DEFAULT_FROM_EMAIL
          value: 'glitchtip@{{self.fqdn}}'
          userEditable: true
          description: Sender address of invitations and alerts.
        - name: ENABLE_USER_REGISTRATION
          value: 'false'
        - name: DJANGO_SUPERUSER_EMAIL
          valueFrom:
            userInput:
              label: Admin email
              format: email
          description: Email the administrator signs in with.
        - name: DJANGO_SUPERUSER_PASSWORD
          valueFrom:
            userInput:
              label: Admin password
              sensitive: true
              format: password
              confirm: true
              minLength: 10
              maxLength: 128
              pattern: '^.{10,128}$'
              patternDescription: At least 10 characters
          description: Password of the administrator. Flui does not store or log it outside this install.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 250m
              max: '4'
            memory:
              min: 512Mi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /_health/
        port: 8000
        initialDelay: 30s
        interval: 15s
        timeout: 5s
        retries: 16

  auth:
    mode: native

  # GlitchTip creates its tables on start; the administrator is added once the
  # server answers. Rerunning the step leaves an existing account untouched.
  postInstall:
    - name: create-admin
      exec:
        command:
          - /bin/sh
          - -c
          - ./manage.py createsuperuser --noinput || true

  smokeTest:
    type: http
    path: /_health/
    expectedStatus: 200
    timeoutSeconds: 120
