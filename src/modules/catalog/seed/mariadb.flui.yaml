kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: mariadb
  name: MariaDB
  description: >
    Community-developed fork of MySQL — the most widely used relational
    database for web applications. 100% open source (GPL v2), drop-in
    replacement for MySQL. Used as a building block by WordPress and other
    CMS/web apps in the catalog.
  appKind: DATABASE
  category: database
  tags:
    - database
    - relational
    - sql
    - mysql-compatible
    - building-block
  license: GPL-2.0
  version: '11'
  maintainedAt: '2026-04-22'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mariadb.svg
  links:
    website: https://mariadb.org
    docs: https://mariadb.com/kb/en/documentation/
    source: https://github.com/MariaDB/server

spec:
  type: building-block
  engine: mariadb

  image:
    registry: docker.io
    repository: library/mariadb
    tag: '11-jammy'

  ports:
    - name: mysql
      internal: 3306
      expose: false
      protocol: tcp

  volumes:
    - name: data
      mountPath: /var/lib/mysql
      required: true
      size: 10Gi

  persistence:
    scope: dedicated

  env:
    - name: MARIADB_DATABASE
      value: '{{app.id}}'
    - name: MARIADB_USER
      value: '{{app.id}}'
    - name: MARIADB_PASSWORD
      valueFrom:
        generate: secret
        length: 32
    - name: MARIADB_ROOT_PASSWORD
      valueFrom:
        generate: secret
        length: 32

    # Restore-bootstrap knobs, empty on a normal install and set by the backups
    # engine when it creates a point-in-time restore into a new install. They
    # have to be DECLARED here even though they are always empty: the installer
    # walks the env this manifest declares and reads an override only for those
    # names, so an override for a name that is not here is dropped without a
    # word — and a restore whose environment is dropped does not fail. The
    # image would initialise an empty data directory, the pod would turn Ready,
    # and the job would report success over a database containing nothing.
    - name: FLUI_MARIADB_RESTORE
      value: ''
      description: Internal — set to 1 by a point-in-time restore install.
    - name: FLUI_MARIADB_TARGET_TIME
      value: ''
      description: Internal — UTC instant to recover to.
    - name: FLUI_MARIADB_BASE_LABEL
      value: ''
      description: Internal — a specific base backup to restore, as it stood.
    - name: FLUI_MARIADB_S3_ENDPOINT
      value: ''
      description: Internal — repository endpoint (restore).
    - name: FLUI_MARIADB_S3_BUCKET
      value: ''
      description: Internal — repository bucket (restore).
    - name: FLUI_MARIADB_S3_REGION
      value: ''
      description: Internal — repository region (restore).
    - name: FLUI_MARIADB_S3_PATH
      value: ''
      description: Internal — repository path for this application (restore).
    - name: FLUI_MARIADB_S3_FORCE_PATH_STYLE
      value: ''
      description: Internal — path-style addressing for the repository.
    - name: FLUI_MARIADB_S3_KEY
      value: ''
      secret: true
      description: Internal — repository access key (restore).
    - name: FLUI_MARIADB_S3_KEY_SECRET
      value: ''
      secret: true
      description: Internal — repository secret key (restore).

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 2Gi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 250m
          max: '4'
        memory:
          min: 256Mi
          max: 8Gi
      updatePolicy:
        trigger:
          - OOMKilled
          - CPUThrottling
        cooldown: 10m

  # Born able to be backed up, the same way the Flui Postgres image is born
  # with `wal_level=logical` and `archive_mode=on`. `log_bin` is not a dynamic
  # variable in MariaDB: enabling it later means restarting the database, so a
  # user who decides to protect an existing instance would pay an outage for
  # the privilege — on the very database the backup exists to protect.
  #
  # The standing cost is small and measured: about 0.4 KB per minute on an idle
  # server, bounded per file by `max_binlog_size`. Binary logging is also the
  # prerequisite for live migration, so this is not paid for backup alone.
  configFiles:
    - path: /etc/mysql/conf.d/flui.cnf
      content: |
        [mariadb]
        log_bin = /var/lib/mysql/binlog
        server_id = 1

        # ROW, never MIXED. Statement replay can diverge on non-deterministic
        # statements, and the way that surfaces is the worst outcome a backup
        # can have: the restore succeeds and the data is subtly wrong.
        binlog_format = ROW

        # Bounds how much of the active file has to be re-uploaded each tick,
        # and how much a single lost file costs.
        max_binlog_size = 64M

        # The default is ten days of self-purging, on a timer that knows nothing
        # about what has been shipped. Flui raises this to `0` while a policy is
        # active and purges only what object storage has confirmed — so a
        # stalled shipper fills a disk, loudly, instead of quietly eating the
        # recovery window. Until then the server's own default applies.
        binlog_expire_logs_seconds = 864000

  healthcheck:
    type: exec
    command:
      - healthcheck.sh
      - --connect
      - --innodb_initialized
    initialDelay: 15s
    interval: 10s
    timeout: 5s
    retries: 5

  auth:
    mode: none
