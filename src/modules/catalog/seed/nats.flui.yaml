kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: nats
  name: NATS
  description: >
    High-performance messaging for pub/sub, request-reply, queues, and
    persistent streams (JetStream) — a light, single-binary alternative to
    Kafka and managed message queues. Building block: referenced as a
    dependency by apps that need eventing or work queues.
  appKind: APPLICATION
  category: messaging
  tags:
    - messaging
    - queue
    - pubsub
    - streaming
    - jetstream
    - building-block
  license: Apache-2.0
  version: '2.10'
  maintainedAt: '2026-06-17'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nats.svg
  links:
    website: https://nats.io
    docs: https://docs.nats.io
    source: https://github.com/nats-io/nats-server
  alternativeTo:
    - AWS SQS
    - AWS SNS
    - Google Cloud Pub/Sub
    - Apache Kafka
    - RabbitMQ

spec:
  type: building-block

  image:
    registry: docker.io
    repository: library/nats
    tag: '2.10-alpine'

  # JetStream on, persisted to the data volume; monitoring on 8222 for healthchecks.
  startCommand: 'nats-server --jetstream --store_dir=/data --http_port=8222'

  ports:
    - name: client
      internal: 4222
      expose: false
      protocol: tcp
    - name: monitoring
      internal: 8222
      expose: false
      protocol: http

  volumes:
    - name: data
      mountPath: /data
      required: true
      size: 5Gi

  persistence:
    scope: dedicated

  # No configuration env needed — JetStream + monitoring are set on the command line.
  env: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 512Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 50m
          max: '2'
        memory:
          min: 64Mi
          max: 2Gi
      updatePolicy:
        trigger:
          - OOMKilled
          - CPUThrottling
        cooldown: 10m

  healthcheck:
    type: http
    path: /healthz
    port: 8222
    initialDelay: 5s
    interval: 10s
    timeout: 5s
    retries: 5

  auth:
    mode: none

  smokeTest:
    type: script
    timeoutSeconds: 20
    inline: |
      curl -sf "http://${SMOKE_APP_FQDN}:8222/healthz"
