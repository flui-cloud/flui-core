kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: gitea
  name: Gitea
  description: >
    Lightweight, self-hosted Git service: repositories, pull requests, issues,
    a built-in CI/CD (Gitea Actions) and a package registry — all in a single
    Go binary backed by SQLite. A privacy-respecting alternative to GitHub and
    GitLab with full data ownership.
  appKind: APPLICATION
  category: developer-tools
  tags:
    - git
    - devops
    - ci-cd
    - code-hosting
    - package-registry
  license: MIT
  version: '28.4'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/gitea.svg
  links:
    website: https://about.gitea.com
    docs: https://docs.gitea.com
    source: https://github.com/go-gitea/gitea
  ratings:
    wow: 4
    utility: 5
    euFit: 4
    community: 5
  alternativeTo:
    - GitHub
    - GitLab
    - Bitbucket

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.gitea.com
    repository: gitea
    tag: '28.4.0'

  ports:
    - name: http
      internal: 3000
      expose: true
      protocol: http

  volumes:
    - name: data
      mountPath: /data
      required: true
      size: 10Gi

  persistence:
    scope: dedicated

  env:
    - name: USER_UID
      value: '1000'
      description: Unix UID the Gitea process runs as; owns the /data volume.
    - name: USER_GID
      value: '1000'
      description: Unix GID the Gitea process runs as.
    - name: GITEA__database__DB_TYPE
      value: sqlite3
      description: Use the embedded SQLite database so Gitea runs as a single binary with no external DB.
    - name: GITEA__security__INSTALL_LOCK
      value: 'true'
      description: Skip the web install wizard. The administrator is created from the install form.
    - name: GITEA__service__DISABLE_REGISTRATION
      value: 'true'
      userEditable: true
      description: Close self-registration, so only the administrator adds accounts.
    - name: GITEA_ADMIN_USERNAME
      valueFrom:
        userInput:
          label: Admin username
          default: owner
          format: text
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,31}$'
          patternDescription: Letters, numbers, dots, hyphens and underscores, 3–32 chars, starting with a letter or number
      description: Sign-in name of the site administrator.
    - name: GITEA_ADMIN_EMAIL
      valueFrom:
        userInput:
          label: Admin email
          format: email
      description: Email of the site administrator.
    - name: GITEA_ADMIN_PASSWORD
      valueFrom:
        userInput:
          label: Admin password
          sensitive: true
          format: password
          confirm: true
          minLength: 10
          maxLength: 128
          pattern: '^.{10,128}$'
          patternDescription: At least 10 characters
      description: Password of the site administrator. Flui does not store or log it outside this install.
    - name: GITEA__server__DISABLE_SSH
      value: 'true'
      description: Disable git-over-SSH; cloning and pushing go over HTTPS. Keeps the deployment to a single exposed port.

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 100m
          max: '2'
        memory:
          min: 256Mi
          max: 2Gi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /api/healthz
    port: 3000
    interval: 30s
    timeout: 5s
    retries: 3

  domain:
    auto: true
    userCustomizable: true
    tls: true

  auth:
    mode: native

  postInstall:
    - name: create-admin
      exec:
        command:
          - /bin/sh
          - -c
          - su git -c 'gitea admin user create --admin --username "$GITEA_ADMIN_USERNAME" --email "$GITEA_ADMIN_EMAIL" --password "$GITEA_ADMIN_PASSWORD" --must-change-password=false' || true
