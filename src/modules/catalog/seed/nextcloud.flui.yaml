kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: nextcloud
  name: Nextcloud
  description: >
    Self-hosted cloud platform for file sync, sharing, calendar, contacts
    and collaboration. Runs entirely on your own EU infrastructure with an
    AGPL-3.0 licence — no data leaves your server. This composed stack
    bundles MariaDB, a Redis session cache and a dedicated background-job
    worker (cron) into a single atomic install.
  appKind: APPLICATION
  category: storage
  tags:
    - cloud-storage
    - file-sync
    - collaboration
    - gdpr
    - php
    - self-hosted
  license: AGPL-3.0
  version: '35'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nextcloud.svg
  links:
    website: https://nextcloud.com
    docs: https://docs.nextcloud.com
    source: https://github.com/nextcloud/docker
  ratings:
    wow: 5
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - Google Drive
    - Dropbox
    - Microsoft OneDrive

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  components:
    - name: db
      engine: mariadb
      image:
        registry: docker.io
        repository: library/mariadb
        tag: '12.3-noble'
      ports:
        - name: mysql
          internal: 3306
          expose: false
          protocol: tcp
      volumes:
        - name: db-data
          mountPath: /var/lib/mysql
          required: true
          size: 10Gi
      persistence:
        scope: dedicated
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            generate: secret
            length: 32
        - name: MYSQL_DATABASE
          value: nextcloud
        - name: MYSQL_USER
          value: nextcloud
        - name: MYSQL_PASSWORD
          valueFrom:
            generate: secret
            length: 32
        - name: MARIADB_AUTO_UPGRADE
          value: '1'
        - name: MARIADB_DISABLE_UPGRADE_BACKUP
          value: '1'
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '1'
            memory:
              min: 256Mi
              max: 1Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - healthcheck.sh
          - '--connect'
          - '--innodb_initialized'
        initialDelay: 20s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: redis
      engine: redis
      image:
        registry: docker.io
        repository: library/redis
        tag: '8-alpine'
      ports:
        - name: redis
          internal: 6379
          expose: false
          protocol: tcp
      env: []
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: '250m'
          memory: 128Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 25m
              max: '250m'
            memory:
              min: 32Mi
              max: 128Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: exec
        command:
          - redis-cli
          - ping
        initialDelay: 5s
        interval: 10s
        timeout: 3s
        retries: 5

    - name: app
      dependsOn:
        - db
        - redis
      image:
        registry: docker.io
        repository: library/nextcloud
        tag: '35-apache'
      ports:
        - name: http
          internal: 80
          expose: true
          protocol: http
      volumes:
        - name: nextcloud-data
          mountPath: /var/www/html
          required: true
          size: 20Gi
      env:
        # Shared with the document server when office editing is chosen; unused otherwise.
        - name: ONLYOFFICE_JWT_SECRET
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: MYSQL_HOST
          value: '{{components.db.host}}'
        - name: MYSQL_DATABASE
          value: '{{components.db.env.MYSQL_DATABASE}}'
        - name: MYSQL_USER
          value: '{{components.db.env.MYSQL_USER}}'
        - name: MYSQL_PASSWORD
          value: '{{components.db.env.MYSQL_PASSWORD}}'
          secret: true
        - name: REDIS_HOST
          value: '{{components.redis.host}}'
        # Trusted domains baked at boot from the create-time FQDN, so the app trusts
        # its own domain + localhost from first install — independent of the
        # post-install occ step and the readiness probe (Host=localhost).
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: '{{self.fqdn}} localhost'
        - name: OVERWRITEHOST
          value: '{{self.fqdn}}'
        - name: OVERWRITEPROTOCOL
          value: 'https'
        - name: OVERWRITECLIURL
          value: 'https://{{self.fqdn}}'
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom:
            userInput:
              label: Admin username
              default: admin
              format: text
              minLength: 3
              maxLength: 32
              pattern: '^[a-zA-Z0-9_-]{3,32}$'
              patternDescription: Letters, numbers, hyphens and underscores, 3–32 chars
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            userInput:
              label: Admin password
              sensitive: true
              format: password
              minLength: 8
              maxLength: 128
              confirm: true
        - name: PHP_MEMORY_LIMIT
          value: '512M'
          userEditable: true
          description: PHP memory limit per request (Dockerfile default)
        - name: PHP_UPLOAD_LIMIT
          value: '512M'
          userEditable: true
          description: Maximum upload size per request (Dockerfile default)
        - name: APACHE_BODY_LIMIT
          value: '1073741824'
          userEditable: true
          description: Apache request body limit in bytes (default 1 GiB)
        - name: TZ
          value: 'UTC'
          userEditable: true
          description: Server timezone (IANA format, e.g. Europe/Rome)
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: '1.5'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '1.5'
            memory:
              min: 512Mi
              max: 1Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: http
        path: /status.php
        port: 80
        # Nextcloud 400s any Host not in trusted_domains; the kubelet probes the
        # pod IP. Send a Host it always trusts so readiness reflects the
        # container, not the (post-deploy) ingress/trusted-domain config.
        httpHeaders:
          Host: localhost
        initialDelay: 30s
        interval: 30s
        timeout: 10s
        retries: 6

    # ── 4. ONLYOFFICE Docs (document server) — optional, gated by option "office" ──
    - name: onlyoffice
      when:
        option: office
      dependsOn:
        - app
      image:
        registry: docker.io
        repository: onlyoffice/documentserver
        tag: '10.0.0.1'
      ports:
        - name: http
          internal: 80
          expose: true
          protocol: http
      env:
        - name: JWT_ENABLED
          value: 'true'
        - name: JWT_SECRET
          value: '{{components.app.env.ONLYOFFICE_JWT_SECRET}}'
          secret: true
        # It downloads and saves documents through Nextcloud's in-cluster
        # address, a private one, which it refuses by default; requests to it
        # are JWT-signed, so only Nextcloud can point it anywhere. Cloud
        # metadata addresses stay refused.
        - name: ALLOW_PRIVATE_IP_ADDRESS
          value: 'true'
        - name: ALLOW_META_IP_ADDRESS
          value: 'false'
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 3Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 200m
              max: '4'
            memory:
              min: 1Gi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: http
        path: /healthcheck
        port: 80
        initialDelay: 60s
        interval: 15s
        timeout: 5s
        retries: 12

  auth:
    default: native
    modes:
      - native
      - oidc
    oidc:
      # user_oidc callback endpoints (configured via occ in postInstall).
      redirectPaths:
        - /apps/user_oidc/code
        - /index.php/apps/user_oidc/code
      scopes:
        - openid
        - email
        - profile

  # Install-time feature toggles.
  options:
    - key: office
      label: 'Office editing (ONLYOFFICE)'
      description: 'Edit Word, Excel and PowerPoint files in the browser with ONLYOFFICE Docs Community (AGPL, recommended for up to 20 people editing). Adds a document server.'
      default: false

  # Nextcloud is configured via the `occ` CLI, not HTTP/config-file — so these
  # steps exec inside the app pod (as www-data). The resolved FQDN is known only
  # after the endpoint is created, hence trusted_domains/overwrite live here.
  postInstall:
    # Always: make the app aware it sits behind Flui's TLS reverse proxy.
    - name: configure-proxy
      when:
        authMode:
          - native
          - oidc
      exec:
        command:
          - /bin/sh
          - -c
          - >
            su -s /bin/sh -c "php occ config:system:set trusted_domains 1
            --value={{install.resolvedFqdn}} && php occ config:system:set
            overwritehost --value={{install.resolvedFqdn}} && php occ
            config:system:set overwriteprotocol --value=https && php occ
            config:system:set overwrite.cli.url
            --value=https://{{install.resolvedFqdn}}" www-data
    # OIDC only: install user_oidc and register Flui (Zitadel) as the provider.
    - name: configure-oidc
      when:
        authMode: oidc
      exec:
        command:
          - /bin/sh
          - -c
          - >
            su -s /bin/sh -c "(php occ app:install user_oidc || php occ
            app:enable user_oidc); php occ user_oidc:provider Flui
            --clientid={{oidc.clientId}} --clientsecret={{oidc.clientSecret}}
            --discoveryuri={{oidc.issuerUrl}}/.well-known/openid-configuration
            --unique-uid=0" www-data
    # Office only: install the ONLYOFFICE connector and point it at the
    # document server. The browser loads the editors from its public address;
    # Nextcloud and the document server talk to each other over the cluster.
    - name: enable-office
      when:
        option: office
      exec:
        command:
          - /bin/sh
          - -c
          - >
            su -s /bin/sh -c "(php occ app:install onlyoffice || php occ
            app:enable onlyoffice); php occ config:app:set onlyoffice
            DocumentServerUrl --value=https://{{components.onlyoffice.fqdn}}/;
            php occ config:app:set onlyoffice DocumentServerInternalUrl
            --value=http://{{components.onlyoffice.host}}/; php occ
            config:app:set onlyoffice StorageUrl
            --value=http://{{components.app.host}}/; php occ config:app:set
            onlyoffice jwt_secret --value=$ONLYOFFICE_JWT_SECRET; php occ
            onlyoffice:documentserver --check" www-data

  smokeTest:
    type: http
    path: /status.php
    expectedStatus: 200
    timeoutSeconds: 90
