kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: penpot
  name: Penpot
  description: >
    The open-source design and prototyping platform — a self-hosted alternative
    to Figma. Design UIs, build interactive prototypes and hand off to
    developers with open standards (SVG, CSS), all on infrastructure you own.
    Ships as a full stack (frontend, backend, exporter, PostgreSQL and Valkey),
    installed and torn down together.
  appKind: APPLICATION
  category: design
  tags:
    - design
    - prototyping
    - ui-ux
    - figma-alternative
    - collaboration
    - composed
  license: MPL-2.0
  version: '2.16'
  maintainedAt: '2026-06-15'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/penpot.svg
  links:
    website: https://penpot.app
    docs: https://help.penpot.app
    source: https://github.com/penpot/penpot
  ratings:
    wow: 5
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - Figma
    - Adobe XD
    - Sketch

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: penpot.internal

  components:
    - name: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '15'
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 10Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: penpot
        - name: POSTGRES_USER
          value: penpot
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 5432
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: valkey
      image:
        registry: docker.io
        repository: valkey/valkey
        tag: '8.1'
      ports:
        - name: valkey
          internal: 6379
          expose: false
          protocol: tcp
      env: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '1'
            memory:
              min: 64Mi
              max: 512Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 6379
        initialDelay: 10s
        interval: 10s
        timeout: 5s
        retries: 6

    - name: backend
      dependsOn:
        - postgres
        - valkey
      image:
        registry: docker.io
        repository: penpotapp/backend
        tag: '2.16'
      ports:
        - name: http
          internal: 6060
          expose: false
          protocol: http
      volumes:
        - name: assets
          mountPath: /opt/data
          required: true
          size: 10Gi
      persistence:
        scope: dedicated
      # Penpot's backend image declares a NAMED user ("penpot", UID/GID 1001) and
      # writes uploaded assets to /opt/data/assets. runAsUser/runAsGroup must be
      # numeric: with runAsNonRoot alone the kubelet can't verify a named user
      # and rejects the pod (CreateContainerConfigError). fsGroup lets it own the
      # persistent volume; without it the root-owned PVC is unwritable.
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      env:
        - name: PENPOT_FLAGS
          value: enable-registration disable-email-verification enable-login-with-oidc
        - name: PENPOT_PUBLIC_URI
          value: 'https://{{components.frontend.fqdn}}'
        - name: PENPOT_SECRET_KEY
          valueFrom:
            generate: secret
            length: 32
            format: hex
          description: Signs internal tokens shared with the exporter. Generated once at install.
        - name: PENPOT_DATABASE_URI
          value: 'postgresql://{{components.postgres.host}}:5432/penpot'
        - name: PENPOT_DATABASE_USERNAME
          value: penpot
        - name: PENPOT_DATABASE_PASSWORD
          value: '{{components.postgres.env.POSTGRES_PASSWORD}}'
          secret: true
        - name: PENPOT_REDIS_URI
          value: 'redis://{{components.valkey.host}}:6379/0'
        - name: PENPOT_OBJECTS_STORAGE_BACKEND
          value: fs
        - name: PENPOT_OBJECTS_STORAGE_FS_DIRECTORY
          value: /opt/data/assets
        - name: PENPOT_OIDC_SCOPES
          value: openid profile email
        - name: PENPOT_TELEMETRY_ENABLED
          value: 'false'
        - name: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
          value: '367001600'
        - name: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
          value: '367001600'
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 1536Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 250m
              max: '2'
            memory:
              min: 512Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /readyz
        port: 6060
        initialDelay: 40s
        interval: 15s
        timeout: 5s
        retries: 12

    - name: exporter
      dependsOn:
        - backend
        - valkey
      image:
        registry: docker.io
        repository: penpotapp/exporter
        tag: '2.16'
      ports:
        - name: http
          internal: 6061
          expose: false
          protocol: http
      env:
        - name: PENPOT_SECRET_KEY
          value: '{{components.backend.env.PENPOT_SECRET_KEY}}'
          secret: true
        - name: PENPOT_PUBLIC_URI
          value: 'http://{{components.frontend.host}}:8080'
        - name: PENPOT_REDIS_URI
          value: 'redis://{{components.valkey.host}}:6379/0'
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 768Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 1Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: tcp
        port: 6061
        initialDelay: 20s
        interval: 15s
        timeout: 5s
        retries: 8

    - name: frontend
      dependsOn:
        - backend
        - exporter
      image:
        registry: docker.io
        repository: penpotapp/frontend
        tag: '2.16'
      ports:
        - name: http
          internal: 8080
          expose: true
          protocol: http
      env:
        - name: PENPOT_FLAGS
          value: enable-registration disable-email-verification enable-login-with-oidc
        - name: PENPOT_PUBLIC_URI
          value: 'https://{{self.fqdn}}'
        - name: PENPOT_BACKEND_URI
          value: 'http://{{components.backend.host}}:6060'
        - name: PENPOT_EXPORTER_URI
          value: 'http://{{components.exporter.host}}:6061'
        - name: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
          value: '367001600'
        - name: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
          value: '367001600'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '1'
            memory:
              min: 64Mi
              max: 512Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /
        port: 8080
        initialDelay: 10s
        interval: 15s
        timeout: 5s
        retries: 8

  # Native account by default; optionally Single Sign-On via Flui (Zitadel).
  # Penpot's OAuth flow lives in the backend, so the OIDC client credentials are
  # injected there (targetComponent) even though the frontend is the exposed one.
  auth:
    default: native
    modes:
      - native
      - oidc
    oidc:
      targetComponent: backend
      redirectPaths:
        - /api/auth/oidc/callback
      scopes:
        - openid
        - profile
        - email
      envMapping:
        issuerUrl: PENPOT_OIDC_BASE_URI
        clientId: PENPOT_OIDC_CLIENT_ID
        clientSecret: PENPOT_OIDC_CLIENT_SECRET
      # Zitadel returns email/profile only from the userinfo endpoint (the ID
      # token omits them by default), so read user info there. Injected only in
      # OIDC mode — static it would fail the pre-wiring boot (:invalid-sso-config).
      extraEnv:
        PENPOT_OIDC_USER_INFO_SOURCE: userinfo

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 60
