kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: postgresql
  name: PostgreSQL
  description: >
    Relational database used as a foundation building block for composed
    catalog apps. Not installed directly — referenced as a dependency.
  appKind: DATABASE
  category: database
  tags:
    - database
    - relational
    - sql
    - building-block
  license: PostgreSQL
  version: '17'
  maintainedAt: '2026-07-03'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/postgres.svg
  links:
    website: https://www.postgresql.org
    docs: https://www.postgresql.org/docs/
    source: https://github.com/postgres/postgres

spec:
  type: building-block
  engine: postgres

  image:
    registry: ghcr.io
    repository: flui-cloud/flui-postgres
    tag: '17-dev'

  ports:
    - name: postgres
      internal: 5432
      expose: false
      protocol: tcp

  volumes:
    - name: data
      mountPath: /var/lib/postgresql/data
      required: true
      size: 10Gi

  persistence:
    scope: dedicated

  env:
    - name: POSTGRES_DB
      value: '{{app.id}}'
    - name: POSTGRES_USER
      value: '{{app.id}}'
    - name: POSTGRES_PASSWORD
      valueFrom:
        generate: secret
        length: 32
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    # Restore-bootstrap knobs (empty on a normal install; the backups engine sets
    # them via envOverrides when creating a PITR restore-to-new-install). Hidden
    # from the editable-env UI on purpose.
    - name: FLUI_PG_RESTORE
      value: ''
      description: Internal — set to 1 by a PITR restore install.
    - name: FLUI_PG_RESTORE_TARGET
      value: ''
      description: Internal — PITR recovery target timestamp.
    - name: FLUI_PG_RESTORE_SET
      value: ''
      description: Internal — pgBackRest backup set to restore (as-of-backup).
    - name: FLUI_PG_S3_ENDPOINT
      value: ''
      description: Internal — pgBackRest repo S3 endpoint (restore).
    - name: FLUI_PG_S3_BUCKET
      value: ''
      description: Internal — pgBackRest repo S3 bucket (restore).
    - name: FLUI_PG_S3_REGION
      value: ''
      description: Internal — pgBackRest repo S3 region (restore).
    - name: FLUI_PG_S3_KEY
      value: ''
      secret: true
      description: Internal — pgBackRest repo S3 access key (restore).
    - name: FLUI_PG_S3_KEY_SECRET
      value: ''
      secret: true
      description: Internal — pgBackRest repo S3 secret key (restore).
    - name: FLUI_PG_S3_URI_STYLE
      value: ''
      description: Internal — pgBackRest repo S3 uri-style (restore).
    - name: FLUI_PG_S3_PATH
      value: ''
      description: Internal — pgBackRest repo path (restore).

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 2Gi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 250m
          max: '4'
        memory:
          min: 256Mi
          max: 8Gi
      updatePolicy:
        trigger:
          - OOMKilled
          - CPUThrottling
        cooldown: 10m

  healthcheck:
    type: exec
    command:
      - pg_isready
      - -U
      - '{{env.POSTGRES_USER}}'
    initialDelay: 10s
    interval: 10s
    timeout: 5s
    retries: 5

  auth:
    mode: none

  smokeTest:
    type: script
    timeoutSeconds: 20
    inline: |
      psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SMOKE_APP_FQDN}:5432/${POSTGRES_DB}" \
        -c "CREATE TABLE _smoke_test (id SERIAL PRIMARY KEY); DROP TABLE _smoke_test;"
