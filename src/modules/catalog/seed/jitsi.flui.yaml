kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: jitsi
  name: Jitsi Meet
  description: >
    Video meetings in the browser and in the Jitsi apps, with screen sharing,
    chat, raised hands, breakout rooms and end-to-end encryption, on your own
    server. A self-hosted alternative to Zoom, Google Meet and Microsoft
    Teams meetings. Only the host account chosen at install can start a
    meeting; anyone with the link can join one that has started. Audio and
    video travel over UDP port 10000, which the cluster firewall has to let
    in: Flui never opens it on its own, and shows whether it is open before
    and after the install. The video bridge learns the server's public
    address from a public STUN server, meet-jit-si-turnrelay.jitsi.net, at
    start.
  appKind: APPLICATION
  category: productivity
  tags:
    - video
    - meetings
    - conferencing
    - webrtc
    - collaboration
    - composed
  license: Apache-2.0
  version: stable-11509
  maintainedAt: '2026-11-21'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/jitsi-meet.svg
  links:
    website: https://jitsi.org/jitsi-meet/
    docs: https://jitsi.github.io/handbook/
    source: https://github.com/jitsi/docker-jitsi-meet
  alternativeTo:
    - Zoom
    - Google Meet
    - Microsoft Teams

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: jitsi.internal

  components:
    - name: prosody
      image:
        registry: ghcr.io
        repository: jitsi/prosody
        tag: stable-11509-1
      ports:
        - name: xmpp
          internal: 5222
          expose: false
          protocol: tcp
        - name: http
          internal: 5280
          expose: false
          protocol: http
      # Mounted one level up: prosody refuses a data directory it does not own,
      # and local volumes ignore fsGroup, so it creates `data` itself.
      volumes:
        - name: data
          mountPath: /var/lib/prosody
          required: true
          size: 1Gi
      securityContext:
        fsGroup: 1000
      env:
        - name: ENABLE_AUTH
          value: '1'
        - name: AUTH_TYPE
          value: internal
        - name: ENABLE_GUESTS
          value: '1'
        - name: PUBLIC_URL
          value: 'https://{{components.web.fqdn}}'
        - name: JICOFO_AUTH_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: JVB_AUTH_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: JITSI_ADMIN_USER
          valueFrom:
            userInput:
              label: Administrator username
              default: admin
              format: text
              minLength: 3
              maxLength: 32
              pattern: '^[a-z0-9._-]{3,32}$'
              patternDescription: Lowercase letters, numbers, dots, hyphens and underscores, 3–32 chars
          description: The account that starts meetings. Share it with the people who host them.
        - name: JITSI_ADMIN_PASSWORD
          valueFrom:
            userInput:
              label: Administrator password
              sensitive: true
              format: password
              confirm: true
              minLength: 12
              maxLength: 128
          description: Password of the account that starts meetings. Flui does not store or log it outside this install.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: '1'
          memory: 512Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '2'
            memory:
              min: 128Mi
              max: 1Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 5222
        initialDelay: 15s
        interval: 15s
        timeout: 5s
        retries: 10

    - name: jicofo
      dependsOn:
        - prosody
      image:
        registry: ghcr.io
        repository: jitsi/jicofo
        tag: stable-11509-1
      # Nothing connects to jicofo: it dials out to prosody, so it has no port.
      env:
        - name: XMPP_SERVER
          value: '{{components.prosody.host}}'
        - name: JICOFO_AUTH_PASSWORD
          value: '{{components.prosody.env.JICOFO_AUTH_PASSWORD}}'
          secret: true
        - name: ENABLE_AUTH
          value: '1'
        - name: AUTH_TYPE
          value: internal
        - name: JICOFO_MAX_MEMORY
          value: 768m
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 384Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      # Its REST port listens on loopback only, and its own health check fails
      # until a bridge joins, which is deployed after it: /stats answers as
      # soon as it is up.
      healthcheck:
        type: exec
        command:
          - curl
          - -fs
          - http://127.0.0.1:8888/stats
        initialDelay: 30s
        interval: 15s
        timeout: 5s
        retries: 10

    - name: jvb
      dependsOn:
        - prosody
      image:
        registry: ghcr.io
        repository: jitsi/jvb
        tag: stable-11509-1
      ports:
        - name: http
          internal: 8080
          expose: false
          protocol: http
      udpPorts:
        - name: media
          port: 10000
      env:
        - name: XMPP_SERVER
          value: '{{components.prosody.host}}'
        - name: JVB_AUTH_PASSWORD
          value: '{{components.prosody.env.JVB_AUTH_PASSWORD}}'
          secret: true
        - name: JVB_PORT
          value: '10000'
        - name: PUBLIC_URL
          value: 'https://{{components.web.fqdn}}'
        - name: VIDEOBRIDGE_MAX_MEMORY
          value: 1536m
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
        limits:
          cpu: '4'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 250m
              max: '8'
            memory:
              min: 768Mi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: http
        path: /about/health
        port: 8080
        initialDelay: 30s
        interval: 15s
        timeout: 5s
        retries: 10

    - name: web
      dependsOn:
        - prosody
      image:
        registry: ghcr.io
        repository: jitsi/web
        tag: stable-11509-1
      ports:
        - name: http
          internal: 8000
          expose: true
          protocol: http
      env:
        - name: PUBLIC_URL
          value: 'https://{{self.fqdn}}'
        - name: XMPP_BOSH_URL_BASE
          value: 'http://{{components.prosody.host}}:5280'
        - name: DISABLE_HTTPS
          value: '1'
        - name: ENABLE_HTTP_REDIRECT
          value: '0'
        - name: ENABLE_IPV6
          value: '0'
        - name: ENABLE_AUTH
          value: '1'
        - name: AUTH_TYPE
          value: internal
        - name: ENABLE_GUESTS
          value: '1'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: '1'
          memory: 256Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '2'
            memory:
              min: 64Mi
              max: 512Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: http
        path: /
        port: 8000
        initialDelay: 10s
        interval: 15s
        timeout: 5s
        retries: 10

  auth:
    mode: native

  postInstall:
    - name: create-admin
      description: Creates the administrator account chosen at install; a no-op when it already exists.
      exec:
        component: prosody
        command:
          - /bin/sh
          - -c
          - prosodyctl --config /run/prosody/config/prosody.cfg.lua shell user create "$JITSI_ADMIN_USER@meet.jitsi" "$JITSI_ADMIN_PASSWORD" || true

  smokeTest:
    type: http
    path: /config.js
    expectedStatus: 200
    timeoutSeconds: 300
