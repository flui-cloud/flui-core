kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: litellm
  name: LiteLLM
  description: >
    One gateway in front of every large language model API — OpenAI, Anthropic,
    Mistral, Google, Azure, Bedrock and self-hosted models — behind a single
    OpenAI-compatible endpoint. Hand out virtual keys per team or application,
    set budgets and rate limits, and track spend from the admin UI at /ui.
    Models and provider keys are added from that UI and kept encrypted in the
    install's own PostgreSQL, installed and torn down together. Runs the
    open-source edition only.
  appKind: APPLICATION
  category: ai
  tags:
    - ai
    - llm
    - gateway
    - openai-compatible
    - api
    - composed
  license: MIT
  version: '1.110'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/litellm.svg
  entrypointPath: /ui
  links:
    website: https://www.litellm.ai
    docs: https://docs.litellm.ai
    source: https://github.com/BerriAI/litellm
  ratings:
    wow: 4
    utility: 5
    euFit: 4
    community: 5
  alternativeTo:
    - Amazon Bedrock
    - Azure OpenAI
    - OpenRouter

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: litellm.internal

  components:
    - name: db
      engine: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '17-alpine'
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 5Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: litellm
        - name: POSTGRES_USER
          value: litellm
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - pg_isready
          - -U
          - litellm
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: litellm
      dependsOn:
        - db
      image:
        registry: ghcr.io
        repository: berriai/litellm
        tag: v1.110.2
      ports:
        - name: http
          internal: 4000
          expose: true
          protocol: http
      env:
        - name: DATABASE_URL
          value: 'postgresql://{{components.db.env.POSTGRES_USER}}:{{components.db.env.POSTGRES_PASSWORD}}@{{components.db.host}}:5432/{{components.db.env.POSTGRES_DB}}'
          secret: true
        - name: LITELLM_MASTER_KEY_SEED
          valueFrom:
            generate: secret
            length: 48
            format: hex
          description: Random part of the master key. Generated once at install.
        - name: LITELLM_MASTER_KEY
          value: 'sk-{{self.env.LITELLM_MASTER_KEY_SEED}}'
          secret: true
          description: Admin key of the gateway. Use it to call the admin API and to create virtual keys; give applications virtual keys, never this one.
        - name: LITELLM_SALT_KEY
          valueFrom:
            generate: secret
            length: 48
            format: hex
          description: Encrypts the provider keys stored in the database. Generated once at install; changing it makes the stored keys unreadable.
        - name: UI_USERNAME
          valueFrom:
            userInput:
              label: Admin username
              default: admin
              format: text
              minLength: 3
              maxLength: 32
              pattern: '^[a-zA-Z0-9_.-]{3,32}$'
              patternDescription: Letters, numbers, dots, hyphens and underscores, 3–32 chars
          description: Sign-in name of the admin UI at /ui.
        - name: UI_PASSWORD
          valueFrom:
            userInput:
              label: Admin password
              sensitive: true
              format: password
              confirm: true
              minLength: 12
              maxLength: 128
              pattern: '^.{12,128}$'
              patternDescription: At least 12 characters
          description: Password of the admin UI at /ui. Flui does not store or log it outside this install.
        - name: STORE_MODEL_IN_DB
          value: 'True'
        - name: LITELLM_MODE
          value: PRODUCTION
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 200m
              max: '4'
            memory:
              min: 512Mi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /health/liveliness
        port: 4000
        initialDelay: 40s
        interval: 15s
        timeout: 5s
        retries: 16

  auth:
    mode: native

  smokeTest:
    type: http
    path: /health/liveliness
    expectedStatus: 200
    timeoutSeconds: 120
