kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: vaultwarden
  name: Vaultwarden
  description: >
    Self-hosted password manager compatible with all official Bitwarden
    clients. Your credentials stay on your own EU server.

    Sign-ups are closed: the owner email from the install form is invited and
    can create its account. Invite more people from /admin with the admin token
    shown under Configuration → Sensitive Variables.
  appKind: APPLICATION
  category: security
  tags:
    - password-manager
    - security
    - bitwarden-compatible
    - gdpr
  license: AGPL-3.0
  version: '1.37.5'
  maintainedAt: '2026-11-20'
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden.svg
  links:
    website: https://github.com/dani-garcia/vaultwarden
    docs: https://github.com/dani-garcia/vaultwarden/wiki
    source: https://github.com/dani-garcia/vaultwarden
  ratings:
    wow: 4
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - 1Password
    - LastPass
    - Bitwarden Cloud

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.io
    repository: vaultwarden/server
    tag: '1.37.5'

  ports:
    - name: http
      internal: 80
      expose: true
      protocol: http

  volumes:
    - name: data
      mountPath: /data
      required: true
      size: 2Gi

  env:
    - name: DOMAIN
      value: 'https://{{app.domain}}'
    - name: ADMIN_TOKEN
      valueFrom:
        generate: secret
        length: 48
    - name: SIGNUPS_ALLOWED
      value: 'false'
      userEditable: true
      description: Allow anyone who reaches the address to register an account. Off by default; invited people can always register.
    - name: OWNER_EMAIL
      valueFrom:
        userInput:
          label: Owner email
          format: email
          pattern: '^[^\s"\\]+@[^\s"\\]+$'
          patternDescription: A plain email address
      description: Email invited at install, so its owner can create the first account.

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 100m
          max: '1'
        memory:
          min: 64Mi
          max: 512Mi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  domain:
    auto: true
    userCustomizable: true
    tls: true

  postInstall:
    - name: invite-owner
      exec:
        command:
          - /bin/sh
          - -c
          - >-
            j=$(mktemp); curl -sf -c "$j" -o /dev/null -X POST http://127.0.0.1:80/admin --data-urlencode "token=$ADMIN_TOKEN" && curl -sf -b "$j" -o /dev/null -X POST http://127.0.0.1:80/admin/invite -H "Content-Type: application/json" -d "{\"email\":\"$OWNER_EMAIL\"}" && echo invited; rm -f "$j"; true
