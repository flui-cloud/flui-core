kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: twenty
  name: Twenty
  description: >
    A modern, open-source CRM — a self-hosted alternative to Salesforce. Manage
    contacts, companies and deals with a fast, customisable interface, rich data
    model and a built-in API. Ships as the web/API server, a background worker,
    PostgreSQL and Redis, installed and torn down together.
  appKind: APPLICATION
  category: productivity
  tags:
    - crm
    - sales
    - contacts
    - salesforce-alternative
    - composed
  license: AGPL-3.0
  version: '2.14'
  maintainedAt: '2026-06-15'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/twenty.svg
  links:
    website: https://twenty.com
    docs: https://twenty.com/developers
    source: https://github.com/twentyhq/twenty
  ratings:
    wow: 5
    utility: 5
    euFit: 4
    community: 5
  alternativeTo:
    - Salesforce
    - HubSpot
    - Pipedrive

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: twenty.internal

  components:
    - name: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '16'
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 5Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: default
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 5432
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    - name: redis
      image:
        registry: docker.io
        repository: library/redis
        tag: 7-alpine
      ports:
        - name: redis
          internal: 6379
          expose: false
          protocol: tcp
      env: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '1'
            memory:
              min: 64Mi
              max: 512Mi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: tcp
        port: 6379
        initialDelay: 10s
        interval: 10s
        timeout: 5s
        retries: 6

    - name: server
      dependsOn:
        - postgres
        - redis
      image:
        registry: docker.io
        repository: twentycrm/twenty
        tag: v2.14.0
      ports:
        - name: http
          internal: 3000
          expose: true
          protocol: http
      volumes:
        - name: storage
          mountPath: /app/packages/twenty-server/.local-storage
          required: true
          size: 10Gi
      persistence:
        scope: dedicated
      env:
        - name: PG_DATABASE_URL
          value: 'postgres://postgres:{{components.postgres.env.POSTGRES_PASSWORD}}@{{components.postgres.host}}:5432/default'
          secret: true
        - name: REDIS_URL
          value: 'redis://{{components.redis.host}}:6379'
        - name: SERVER_URL
          value: 'https://{{self.fqdn}}'
        - name: STORAGE_TYPE
          value: local
        - name: APP_SECRET
          valueFrom:
            generate: secret
            length: 32
            format: hex
          description: Signs tokens shared between server and worker. Generated once at install.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 250m
              max: '2'
            memory:
              min: 512Mi
              max: 3Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m
      healthcheck:
        type: http
        path: /healthz
        port: 3000
        initialDelay: 40s
        interval: 15s
        timeout: 5s
        retries: 16

    - name: worker
      dependsOn:
        - server
      image:
        registry: docker.io
        repository: twentycrm/twenty
        tag: v2.14.0
      # Same image as the server, run as the background job processor. k8s
      # command overrides the image entrypoint (which the server still runs for
      # DB migrations + cron registration), so the worker only processes jobs.
      startCommand: yarn worker:prod
      env:
        - name: PG_DATABASE_URL
          value: 'postgres://postgres:{{components.postgres.env.POSTGRES_PASSWORD}}@{{components.postgres.host}}:5432/default'
          secret: true
        - name: REDIS_URL
          value: 'redis://{{components.redis.host}}:6379'
        - name: SERVER_URL
          value: 'https://{{components.server.fqdn}}'
        - name: STORAGE_TYPE
          value: local
        - name: DISABLE_DB_MIGRATIONS
          value: 'true'
        - name: APP_SECRET
          value: '{{components.server.env.APP_SECRET}}'
          secret: true
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 150m
              max: '2'
            memory:
              min: 384Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 5m

  auth:
    mode: native

  smokeTest:
    type: http
    path: /healthz
    expectedStatus: 200
    timeoutSeconds: 60
