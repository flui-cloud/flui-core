kind: CatalogApp
apiVersion: flui.cloud/v1beta1

metadata:
  id: airflow
  name: Apache Airflow
  description: >
    Schedules and runs data pipelines written in Python: each workflow is a
    DAG of tasks with retries, dependencies, backfills and a web interface
    to follow every run. A self-hosted alternative to AWS Managed Workflows
    and Google Cloud Composer. Your DAGs live in a Git repository: Airflow
    pulls the branch you choose and picks up every new commit, and each run
    records the commit it ran. Ships as the API server and web interface,
    the scheduler, the DAG processor, the triggerer and their own
    PostgreSQL, installed and torn down together. Tasks run inside the
    scheduler, which suits small and medium workloads.
  appKind: APPLICATION
  category: automation
  tags:
    - workflows
    - data-pipelines
    - etl
    - scheduler
    - python
    - composed
  license: Apache-2.0
  version: '3.4'
  maintainedAt: '2026-11-21'
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/apache-airflow.svg
  links:
    website: https://airflow.apache.org
    docs: https://airflow.apache.org/docs/apache-airflow/stable/
    source: https://github.com/apache/airflow
  ratings:
    wow: 4
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - AWS Managed Workflows for Apache Airflow
    - Google Cloud Composer

spec:
  type: composed

  domain:
    auto: true
    tls: true
    userCustomizable: true

  networking:
    internal: airflow.internal

  components:
    - name: db
      engine: postgres
      image:
        registry: docker.io
        repository: library/postgres
        tag: '17-alpine'
      ports:
        - name: postgres
          internal: 5432
          expose: false
          protocol: tcp
      volumes:
        - name: data
          mountPath: /var/lib/postgresql/data
          required: true
          size: 5Gi
      persistence:
        scope: dedicated
      env:
        - name: POSTGRES_DB
          value: airflow
        - name: POSTGRES_USER
          value: airflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            generate: secret
            length: 32
            format: hex
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 256Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
              - CPUThrottling
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - pg_isready
          - -U
          - airflow
        initialDelay: 15s
        interval: 10s
        timeout: 5s
        retries: 10

    # Owns the database schema and every shared secret; the other three read
    # them from here, so they wait for it.
    - name: api
      dependsOn:
        - db
      image:
        registry: docker.io
        repository: apache/airflow
        tag: 3.4.0
      command:
        - bash
        - -c
        - airflow db migrate && exec airflow api-server --port 8080
      ports:
        - name: http
          internal: 8080
          expose: true
          protocol: http
      env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: 'postgresql+psycopg2://airflow:{{components.db.env.POSTGRES_PASSWORD}}@{{components.db.host}}:5432/airflow'
          secret: true
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW_FERNET_SEED
          valueFrom:
            generate: secret
            length: 43
            format: base64url
          description: Encrypts the connections and variables Airflow stores. Losing it makes them unreadable.
        # A Fernet key is 32 bytes in padded URL-safe base64: 43 characters and "=".
        - name: AIRFLOW__CORE__FERNET_KEY
          value: '{{env.AIRFLOW_FERNET_SEED}}='
          secret: true
        - name: AIRFLOW__API__SECRET_KEY
          valueFrom:
            generate: secret
            length: 64
            format: hex
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          valueFrom:
            generate: secret
            length: 64
            format: hex
          description: Signs the tokens tasks use to report back. Shared by every component.
        - name: AIRFLOW__CORE__AUTH_MANAGER
          value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__API__BASE_URL
          value: 'https://{{self.fqdn}}'
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: 'http://{{self.host}}:8080/execution/'
        - name: AIRFLOW_DAGS_REPO
          valueFrom:
            userInput:
              label: Git repository with your DAGs
              sensitive: true
              format: url
              placeholder: https://github.com/acme/pipelines.git
              maxLength: 512
              pattern: '^(https://|git@)[^\s"\\]+$'
              patternDescription: An https:// or git@ address. For a private repository put a read-only token in it, for example https://x-access-token:TOKEN@github.com/acme/pipelines.git
          description: Airflow reads every Python file in it that defines a DAG. Kept as a secret because it may carry a token.
        - name: AIRFLOW_DAGS_BRANCH
          valueFrom:
            userInput:
              label: Branch
              default: main
              format: text
              maxLength: 128
              pattern: '^[A-Za-z0-9._/-]+$'
              patternDescription: A branch name such as main
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: '[{"name":"dags","classpath":"airflow.providers.git.bundles.git.GitDagBundle","kwargs":{"tracking_ref":"{{env.AIRFLOW_DAGS_BRANCH}}","git_conn_id":"flui_dags"}}]'
        - name: AIRFLOW_CONN_FLUI_DAGS
          value: '{"conn_type":"git","host":"{{env.AIRFLOW_DAGS_REPO}}"}'
          secret: true
        - name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL
          value: '60'
        - name: AIRFLOW_ADMIN_USER
          valueFrom:
            userInput:
              label: Admin username
              default: admin
              format: text
              minLength: 2
              maxLength: 64
              pattern: '^[A-Za-z0-9._@-]+$'
              patternDescription: Letters, digits and . _ @ -
        - name: AIRFLOW_ADMIN_EMAIL
          valueFrom:
            userInput:
              label: Admin email
              format: email
        - name: AIRFLOW_ADMIN_PASSWORD
          valueFrom:
            userInput:
              label: Admin password
              sensitive: true
              format: password
              confirm: true
              minLength: 12
              maxLength: 128
          description: Password of the first administrator. Flui does not store or log it outside this install.
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: '2'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 200m
              max: '2'
            memory:
              min: 768Mi
              max: 3Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: http
        path: /api/v2/monitor/health
        port: 8080
        initialDelay: 60s
        interval: 20s
        timeout: 10s
        retries: 20

    # Runs the tasks too (LocalExecutor) and serves their logs to the API
    # server on 8793 and 8794 (triggerer), addressed by pod IP since a pod's
    # name does not resolve.
    - name: scheduler
      dependsOn:
        - api
      image:
        registry: docker.io
        repository: apache/airflow
        tag: 3.4.0
      command:
        - airflow
        - scheduler
      env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: '{{components.api.env.AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}}'
          secret: true
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW__CORE__FERNET_KEY
          value: '{{components.api.env.AIRFLOW__CORE__FERNET_KEY}}'
          secret: true
        - name: AIRFLOW__API__SECRET_KEY
          value: '{{components.api.env.AIRFLOW__API__SECRET_KEY}}'
          secret: true
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          value: '{{components.api.env.AIRFLOW__API_AUTH__JWT_SECRET}}'
          secret: true
        - name: AIRFLOW__CORE__AUTH_MANAGER
          value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: 'http://{{components.api.host}}:8080/execution/'
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: '{{components.api.env.AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST}}'
        - name: AIRFLOW_CONN_FLUI_DAGS
          value: '{{components.api.env.AIRFLOW_CONN_FLUI_DAGS}}'
          secret: true
        - name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL
          value: '60'
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: airflow.utils.net.get_host_ip_address
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: '2'
          memory: 4Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 200m
              max: '4'
            memory:
              min: 768Mi
              max: 8Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - airflow
          - jobs
          - check
          - --job-type
          - SchedulerJob
          - --local
        initialDelay: 60s
        interval: 60s
        timeout: 30s
        retries: 5

    - name: dag-processor
      dependsOn:
        - api
      image:
        registry: docker.io
        repository: apache/airflow
        tag: 3.4.0
      command:
        - airflow
        - dag-processor
      env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: '{{components.api.env.AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}}'
          secret: true
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW__CORE__FERNET_KEY
          value: '{{components.api.env.AIRFLOW__CORE__FERNET_KEY}}'
          secret: true
        - name: AIRFLOW__API__SECRET_KEY
          value: '{{components.api.env.AIRFLOW__API__SECRET_KEY}}'
          secret: true
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          value: '{{components.api.env.AIRFLOW__API_AUTH__JWT_SECRET}}'
          secret: true
        - name: AIRFLOW__CORE__AUTH_MANAGER
          value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: 'http://{{components.api.host}}:8080/execution/'
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: '{{components.api.env.AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST}}'
        - name: AIRFLOW_CONN_FLUI_DAGS
          value: '{{components.api.env.AIRFLOW_CONN_FLUI_DAGS}}'
          secret: true
        - name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL
          value: '60'
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: airflow.utils.net.get_host_ip_address
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 2Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 100m
              max: '2'
            memory:
              min: 512Mi
              max: 4Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - airflow
          - jobs
          - check
          - --job-type
          - DagProcessorJob
          - --local
        initialDelay: 60s
        interval: 60s
        timeout: 30s
        retries: 5

    - name: triggerer
      dependsOn:
        - api
      image:
        registry: docker.io
        repository: apache/airflow
        tag: 3.4.0
      command:
        - airflow
        - triggerer
      env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: '{{components.api.env.AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}}'
          secret: true
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW__CORE__FERNET_KEY
          value: '{{components.api.env.AIRFLOW__CORE__FERNET_KEY}}'
          secret: true
        - name: AIRFLOW__API__SECRET_KEY
          value: '{{components.api.env.AIRFLOW__API__SECRET_KEY}}'
          secret: true
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          value: '{{components.api.env.AIRFLOW__API_AUTH__JWT_SECRET}}'
          secret: true
        - name: AIRFLOW__CORE__AUTH_MANAGER
          value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: 'http://{{components.api.host}}:8080/execution/'
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: '{{components.api.env.AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST}}'
        - name: AIRFLOW_CONN_FLUI_DAGS
          value: '{{components.api.env.AIRFLOW_CONN_FLUI_DAGS}}'
          secret: true
        - name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL
          value: '60'
        - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
          value: airflow.utils.net.get_host_ip_address
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          cpu: '1'
          memory: 1Gi
      scaling:
        horizontal:
          enabled: false
        vertical:
          enabled: true
          mode: Recreate
          bounds:
            cpu:
              min: 50m
              max: '2'
            memory:
              min: 384Mi
              max: 2Gi
          updatePolicy:
            trigger:
              - OOMKilled
            cooldown: 10m
      healthcheck:
        type: exec
        command:
          - airflow
          - jobs
          - check
          - --job-type
          - TriggererJob
          - --local
        initialDelay: 60s
        interval: 60s
        timeout: 30s
        retries: 5

  auth:
    mode: native

  postInstall:
    - name: create-admin
      description: Creates the administrator chosen at install; a no-op when it already exists.
      exec:
        component: api
        command:
          - bash
          - -c
          - airflow users create --username "$AIRFLOW_ADMIN_USER" --password "$AIRFLOW_ADMIN_PASSWORD" --email "$AIRFLOW_ADMIN_EMAIL" --firstname Admin --lastname Airflow --role Admin || true

  smokeTest:
    type: http
    path: /api/v2/monitor/health
    expectedStatus: 200
    timeoutSeconds: 300
