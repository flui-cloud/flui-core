# Flui-managed born-migratable defaults.
# Included from postgresql.conf; every setting here is overridable by ALTER SYSTEM
# (postgresql.auto.conf is read last). archive_mode is on from birth with a no-op
# archive_command, so enabling continuous backup later is a reload, never a restart.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
archive_mode = on
archive_command = '/bin/true'
